services:
  - type: web
    name: indian-anpr-system
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 180 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PUBLIC_DEMO_MODE
        value: "false"
